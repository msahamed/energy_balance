# Bengal Basin - Madhupur Fault POC
# Minimal viable model for earthquake cycle simulation
# Based on 2025 Narsingdi earthquake (M5.4)
# Reference: Updated from working Tonga v2 config

[sim]
modelname = bengal_madhupur
max_time_in_yr = 2000        # 2000 years (3-5 earthquake cycles)
max_steps = 1000000          # Safety limit
output_time_interval_in_yr = 1    # Output every 1 year (good for POC analysis)
output_step_interval = 50000      # Backup: output every 50k steps if time-based fails
checkpoint_frame_interval = 1     # Write checkpoint every output for restart capability
has_initial_checkpoint = yes      # Write checkpoint at step 0

# Restart from frame 2 to test restart functionality
is_restarting = no
restarting_from_modelname = output/bengal_madhupur_20251215_111338/runs/bengal_madhupur
restarting_from_frame = 2

has_output_during_remeshing = no
is_outputting_averaged_fields = no

[mesh]
meshing_option = 90              # Use built-in mesher (like Tonga v2)
poly_filename = madhupur_fault.poly
meshing_verbosity = 1

# Domain size (defined in .poly file)
xlength = 200e3    # 200 km wide
ylength = 1e3      # 1 km (dummy for 2D)
zlength = 100e3    # 100 km deep (2D depth is z-direction)
resolution = 500   # 500m resolution (POC balance: speed vs RSF accuracy)
smallest_size = 0.08

# Mesh quality control (from Tonga v2)
min_angle = 28.0
min_quality = 0.15
quality_check_step_interval = 100   # Check frequently
max_boundary_distortion = 2.0       # Allow some movement
remeshing_option = 1                # Basic remeshing
is_discarding_internal_segments = no

[control]
gravity = 10.0
characteristic_speed = 1.58e-9
dt_fraction = 0.5                # Conservative time stepping
ref_pressure_option = 1          # Initialize lithostatic pressure

# Quasi-dynamic earthquake simulation
inertial_scaling = 1e5           # Slow down earthquakes (quasi-dynamic)
is_quasi_static = no             # Need dynamics for earthquakes

# Adaptive time stepping
has_ATS = yes

# No surface processes for POC
surface_process_option = 0
has_thermal_diffusion = yes

[markers]
init_marker_option = 1           # Random markers (from Tonga v2)
markers_per_element = 4
min_num_markers_in_element = 3

[bc]
# Temperature boundary conditions
surface_temperature = 273        # 0°C at surface
mantle_temperature = 1573        # 1300°C at 100 km depth

# Velocity boundary conditions
# Horizontal: Apply 1 cm/yr convergence (Indian plate motion)
vbc_x0 = 1                       # Left boundary: normal velocity fixed
vbc_x1 = 1                       # Right boundary: normal velocity fixed
vbc_z0 = 1                       # Bottom: fixed
vbc_z1 = 0                       # Top: free surface

# Convergence: 1 cm/yr = 3.17e-10 m/s
vbc_val_x0 = 1.585e-10           # Left moves right (0.5 cm/yr)
vbc_val_x1 = -1.585e-10          # Right moves left (0.5 cm/yr)
vbc_val_z0 = 0.0                 # Bottom fixed

# No Winkler foundation for simple model
has_winkler_foundation = no
has_water_loading = no

[ic]
# Initial temperature (simple geotherm)
temperature_option = 1           # Linear geotherm

# Weak zone to seed fault activity
weakzone_option = 3              # Gaussian perturbation
weakzone_standard_deviation = 5e3
weakzone_xcenter = 0.5           # Center of domain
weakzone_ycenter = 0
weakzone_zcenter = 0.15          # ~15 km depth (seismogenic zone)
weakzone_plstrain = 0.5          # Seed with plastic strain

[mat]
rheology_type = elasto-plastic-rsf   # Elastic + Rate-state friction
num_materials = 5                    # 5 shared layers

# Material indices (Shared across fault):
# 0: Alluvium (0-0.5 km)
# 1: Tertiary Sediments (0.5-3 km)
# 2: Upper Crust (3-15 km)
# 3: Middle Crust (15-25 km)
# 4: Lower Crust (25-100 km)

# Density (kg/m³)
rho0 =         [2200,  2500,   2780,  2830,  2950]

# Thermal expansion (1/K)
alpha =        [3e-5,  3e-5,   3e-5,  3e-5,  3e-5]

# Bulk Modulus (Pa)
bulk_modulus = [5e9,   15e9,   40e9,  45e9,  50e9]

# Shear Modulus (Pa)
shear_modulus = [2e9,   8e9,    25e9,  28e9,  30e9]

# Viscosity parameters
visc_exponent =          [3.5,   3.5,    3.5,   3.5,   3.5]
visc_coefficient =       [1e-6,  1e-6,   1e-6,  1e-6,  1e-6]
visc_activation_energy = [3e5,   3e5,    3e5,   3e5,   3e5]
visc_activation_volume = [0,     0,      0,     0,     0]
max_viscosity = 1e24

# Min viscosity
# Min viscosity
min_viscosity = 1e20

# Thermal properties
heat_capacity = [1000, 1000, 1000, 1000, 1000]
therm_cond =    [2.0,  2.2,  2.5,  2.5,  2.5]

# Plastic weakening
pls0 = [0, 0, 0, 0, 0]
pls1 = [0.5, 0.5, 0.5, 0.5, 0.5]

# Cohesion (Pa)
cohesion0 =     [1e6,  10e6, 20e6, 30e6, 40e6]
cohesion1 =     [0.2e6, 2e6,  4e6,  6e6,  8e6]  # 20% residual

# Friction angle (degrees)
friction_angle0 = [22.5, 27.5, 30,   32.5, 35]
friction_angle1 = [20,   25,   25,   25,   30]

# Dilation angle
dilation_angle0 = [0, 0, 0, 0, 0]
dilation_angle1 = [0, 0, 0, 0, 0]

# RATE-STATE FRICTION PARAMETERS
# Seismogenic zone: Upper/Middle Crust (Mats 2,3) -> Velocity WEAKENING (a < b)
# Stable zone: Alluvium/Tertiary/Lower Crust (Mats 0,1,4) -> Velocity STRENGTHENING (a > b)

# Direct effect 'a'
direct_a =      [0.015, 0.015, 0.008, 0.008, 0.015]

# Evolution effect 'b'
evolution_b =   [0.012, 0.012, 0.015, 0.015, 0.012]

# Mat 2,3: a=0.008, b=0.015 -> Unstable (Earthquakes)
# Mat 0,1,4: a=0.015, b=0.012 -> Stable (Creep)

characteristic_velocity = [1e-6, 1e-6, 1e-6, 1e-6, 1e-6]
