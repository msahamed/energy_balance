# Subduction Zone Configuration - Tonga Style
# Thermal runaway study: Cold slab + Fast convergence
# Based on Tonga subduction zone parameters
# Slab age: 120 Ma (old, cold)
# Convergence rate: 8 cm/yr (fast)
# Slab dip: 45 degrees
#
# MODEL SIMPLIFICATION: 2-material setup
#   Mat 0: Subducting plate (oceanic crust + lithospheric mantle combined)
#   Mat 1: Asthenospheric mantle (wedge + deep)
# NOTE: Real Tonga has oceanic crust layer (0-7 km), but lumped into Mat 0
#       for computational efficiency and focus on bulk thermal structure

[sim]
modelname = subduction_tonga
max_time_in_yr = 2000000
max_steps = 200000000
output_step_interval = 10000  # Output every 10k steps instead of 1k
output_time_interval_in_yr = 20000
checkpoint_frame_interval = 5000

# CRITICAL: Enable energy balance for thermal runaway
has_energy_balance = yes
is_outputting_averaged_fields = yes

[mesh]
meshing_option = 90  # Use built-in mesher (reads .poly file directly)
poly_filename = examples/subduction-tonga.poly
meshing_verbosity = 1
xlength = 600e3   # Matches subduction-tonga.poly (600 km)
ylength = 1e3
zlength = 300e3   # Matches subduction-tonga.poly (300 km)
resolution = 6e3
smallest_size = 0.05

quality_check_step_interval = 200  # Check mesh quality regularly
min_quality = 0.15                 # Remesh when quality drops below this
remeshing_option = 1               # Simple remeshing (more robust than option 11)
max_boundary_distortion = 0.5      # Allow more boundary movement before remeshing
is_discarding_internal_segments = no  # Keep slab interface segments

[control]
gravity = 10.0
characteristic_speed = 1.58e-9
dt_fraction = 0.1  # Further reduced for bottom boundary stability
ref_pressure_option = 1  # CRITICAL: Initialize lithostatic pressure

# Thermal diffusion enabled
has_thermal_diffusion = yes

# Quasi-static (no inertia)
is_quasi_static = yes

[markers]
init_marker_option = 1          # Random markers (robust for varying element sizes)
markers_per_element = 4         # 4 markers per element guaranteed
min_num_markers_in_element = 3  # Replenish if falls below 3

[bc]
# Temperature boundary conditions
surface_temperature = 273      # 0°C at surface
mantle_temperature = 1573      # 1300°C at depth

# Velocity boundary conditions
# Convergence: 8 cm/yr = 2.54e-9 m/s
vbc_x0 = 1    # Left (oceanic plate): normal velocity fixed, shear free (Type 1 for 2D)
vbc_x1 = 1    # Right (overriding plate): normal velocity fixed, shear free (Type 1 for 2D)
vbc_z0 = 1    # Bottom: normal velocity fixed, shear free (Type 1 - proper corner handling)
vbc_z1 = 0    # Top: free surface

# Convergence velocities: Oceanic plate (left) moves right toward fixed overriding plate
vbc_val_x0 = 2.54e-9   # Left boundary moves RIGHT at 8 cm/yr (convergence)
vbc_val_x1 = 0.0       # Right boundary fixed (stable overriding plate)
vbc_val_z0 = 0.0       # Bottom: no vertical movement

# Winkler foundation (isostatic support)
has_winkler_foundation = no   # DISABLED: Using fixed bottom boundary

[ic]
# Initial temperature: Cold slab + Hot mantle
temperature_option = 2

# Oceanic plate age (controls slab temperature)
oceanic_plate_age_in_yr = 120e6   # 120 Ma (old, cold - favorable for thermal runaway)

# Lithospheric thickness
lithospheric_thickness = 100e3

# Material types defined in poly file (3 regions: slab, mantle wedge, deep mantle)
# mattype_option not set - uses poly file material regions

# Weak zone to initiate deformation (random perturbation like test_energy)
weakzone_option = 3
weakzone_standard_deviation = 5e3
weakzone_xcenter = 0.5
weakzone_ycenter = 0
weakzone_zcenter = 0.2
weakzone_plstrain = 1

[mat]
rheology_type = elasto-visco-plastic
num_materials = 2         # Two materials: oceanic slab + mantle

# Material 0: COLD OCEANIC LITHOSPHERE (subducting slab)
# Material 1: HOT MANTLE (wedge and deep mantle)

# LITERATURE-BASED PARAMETERS (Hirth & Kohlstedt 2003, Peng et al. 2024)
# See: examples/material_parameters_literature.txt for full references

# Density (kg/m³)
rho0 = [3300, 3300]

# Thermal expansion (1/K)
alpha = [3.0e-5, 3.0e-5]

# Elastic properties (Standard mantle values)
bulk_modulus = [50e9, 50e9]   # 50 GPa
shear_modulus = [30e9, 30e9]  # 30 GPa

# VISCOSITY PARAMETERS - Olivine Dislocation Creep
# Reference: Hirth & Kohlstedt (2003) - standard for subduction modeling

# Stress exponent (nonlinear rheology, essential for subduction)
visc_exponent = [3.5, 3.5]    # Standard for dislocation creep (was 3.05)

# Pre-exponential coefficient (code-specific calibration)
visc_coefficient = [1.25e-1, 1.25e-1]

# Activation energy (temperature sensitivity)
# Mat 0 (Slab): 530 kJ/mol for dry olivine (cold, strong)
# Mat 1 (Wedge): 480 kJ/mol for wet olivine (hot, weak)
visc_activation_energy = [5.3e5, 4.8e5]  # Literature values (was 3.76e5)

# Activation volume (pressure effect - simplified to zero)
visc_activation_volume = [0.0, 0.0]

# Viscosity limits
# Slab: ~10²⁰-10²¹ Pa·s (cold)
# Wedge: ~10¹⁸-10¹⁹ Pa·s (hot, wet - 10-100× lower than slab)
max_viscosity = 1e24
min_viscosity = 1e19    # Allows low viscosity in hot mantle wedge

# Thermal properties
heat_capacity = [1000, 1000]      # J/kg/K
therm_cond = [3.3, 3.3]            # W/m/K

# Plastic properties (Mohr-Coulomb)
# Strain weakening enabled for realistic deformation
# Mat 0 (Slab): Stronger (dry olivine)
# Mat 1 (Wedge): Weaker (hydrated, serpentinized)

# Cohesion (Pa)
# Slab: 40 MPa → 4 MPa (standard weakening)
# Wedge: 20 MPa → 2 MPa (50% weaker due to water)
cohesion0 = [4e7, 2e7]       # Initial: 40 MPa (slab), 20 MPa (wedge)
cohesion1 = [4e6, 2e6]       # Final: 4 MPa (slab), 2 MPa (wedge)

# Friction angle (degrees)
# Slab: 30° (Byerlee's law for dry rock)
# Wedge: 15° (reduced by hydration and serpentinization)
friction_angle0 = [30, 15]    # Initial: 30° (slab), 15° (wedge)
friction_angle1 = [30, 15]    # Final: same (or could weaken further)

# Dilation angle (degrees) - zero for both (volume conserving)
dilation_angle0 = [0, 0]
dilation_angle1 = [0, 0]

# Plastic strain weakening range
pls0 = [0.0, 0.0]
pls1 = [0.1, 0.1]
